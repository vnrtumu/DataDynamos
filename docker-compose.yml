version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datadynamos-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OCR_DEFAULT_ENGINE=paddleocr
      - STRUCTURING_PROVIDER=langextract
      - DECISION_PROVIDER=llm
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
